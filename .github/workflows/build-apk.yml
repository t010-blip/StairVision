name: Build APK

# main에 푸시하거나 Actions 탭에서 "Run workflow"를 누르면 APK를 빌드하고
# Releases에 올린다. 휴대폰 브라우저에서 Releases → app-debug.apk 를 받아 설치하면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StairVision-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StairVision-apk
          path: StairVision-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StairVision build ${{ github.run_number }}
          files: StairVision-${{ github.run_number }}.apk
          body: 휴대폰에서 아래 APK를 눌러 받은 뒤 설치하세요. 사용법은 README.md를 참고하세요.
